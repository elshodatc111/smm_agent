{% extends "base.html" %}
{% block anon %}
<div class="login"><div class="card">
  <div class="logo"><i></i>{{ system_name }}</div>
  <h2>Tizimga kirish</h2>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    <label>Login</label><input name="username" autofocus required autocomplete="username">
    <label>Parol</label><input name="password" type="password" required autocomplete="current-password">
    <div class="mt"><button class="btn primary" style="width:100%;justify-content:center">Kirish</button></div>
  </form>
</div></div>
{% endblock %}
