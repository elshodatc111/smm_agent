{% for f in form %}
  {% if f.field.widget.input_type == 'checkbox' %}
    <label style="display:flex;gap:8px;align-items:center;font-weight:500">{{ f }} {{ f.label }}</label>
  {% else %}<label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% endif %}
  {% if f.help_text %}<div class="help">{{ f.help_text }}</div>{% endif %}{{ f.errors }}
{% endfor %}{{ form.non_field_errors }}
